schema_version: 1
id: go-live
name: Go Live
description: >-
  Transition a project from pre-launch to live — runs the full quality gate
  (predeploy-check, security, tests), deploys safely via ship-safely, then
  updates the project lifecycle posture in CLAUDE.md and AGENTS.md.
  Distinct from ship-safely (which is the deploy gate only) and package-release-readiness
  (which is for library/package publishing without deployment).
category: development
confirm: true
model_route: complex
skills:
  - {name: work-intake-preflight, args: "--auto"}
  - worktrees
  - checkpoint
  - worktree-sessions
  - predeploy-check
  - harden
  - devos-security-review
  - test
  - devos-verify
  - db-migrate
  - ship-safely
  - go-live
  - docs-sync
  - {name: commit, args: "--all"}
  - summarize
clients:
