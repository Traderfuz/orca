schema_version: 1
id: maintenance-session
name: Maintenance Session
description: Inspect project health, diagnose drift, and close maintenance gaps from an isolated worktree. gap-analysis runs with --dalio --converge --fix at end of session.
when_to_use: "Use for scheduled project hygiene — typically weekly or after a sprint. Covers intake preflight, project status, health signals, doc sync, context audit, and a full gap-analysis pass. Distinct from repair-session (reactive: something is broken) and convergence (targeted: close known gaps from a report). Choose maintenance-session when: you want a full proactive sweep, nothing is known to be broken, and you want docs/cleanup included."
category: maintenance
skills:
  - {name: work-intake-preflight, args: "--auto"}
  - worktrees
  - checkpoint
  - worktree-sessions
  - project-status
  - health
  - context-surface-audit
  - docs-sync
  - docs-coverage-audit
  - audit-docs
  - {name: project-artifacts-audit, args: "--apply --yes"}
  - {name: gap-analysis, args: "--dalio --converge --fix"}
  - {name: commit, args: "--all"}
  - summarize
  - project-cleanup
confirm: false
model_route: standard
clients:
  - claude-code
  - codex
  - gemini
  - opencode
  - pi
  - zed
intent_keywords:
  - maintenance
  - health
  - stale
  - gaps
source_doc: profiles/general/workflows/pipelines/maintenance-session.md
