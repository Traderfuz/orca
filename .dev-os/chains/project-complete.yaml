schema_version: 1
id: project-complete
name: Project Complete
description: >-
  Close out a feature spec or project end-to-end — runs completion checks
  (usability, docs sync, user-facing docs), verifies all tasks are done,
  commits final state, and produces a closure summary.
  Use when a spec is fully implemented and you want to formally close it.
